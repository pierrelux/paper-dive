[project]
name = "paper-dive"
version = "0.1.0"
description = "Read a paper, select any sentence, equation, or figure, and get it explained."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.84.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The macOS .app wrapper: a native WKWebView window instead of a browser tab.
desktop = ["pywebview>=5"]

[project.scripts]
paper-dive = "server.app:main"
paper-dive-app = "server.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
